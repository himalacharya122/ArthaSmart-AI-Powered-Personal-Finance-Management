; PlatformIO project for the ArthaSmart NFC Logger.
;
; Target hardware: generic ESP32 dev board (ESP32-WROOM-32) + PN532 NFC
; reader (red "elechouse v3" style board) in I2C mode + passive buzzer
; + status LED. See README.md for wiring.
;
; Build:   pio run
; Flash:   pio run -t upload
; Monitor: pio device monitor   (115200 baud)

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Libraries (versions pinned so a fresh clone builds identically).
;
; - Adafruit PN532 drives the NFC reader over I2C.
; - Adafruit BusIO is a transitive dep of PN532 but some registries don't
;   auto-pull it, so we list it explicitly.
; - ArduinoJson handles request/response serialisation.
;
; WiFi / WiFiClientSecure / HTTPClient / Preferences all ship with the
; ESP32 Arduino core — no entry needed here.
lib_deps =
    adafruit/Adafruit PN532@^1.3.3
    adafruit/Adafruit BusIO@^1.16.1
    bblanchon/ArduinoJson@^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=1
