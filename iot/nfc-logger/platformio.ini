; PlatformIO project for the ArthaSmart NFC Logger.
;
; Target hardware: generic ESP32 dev board (ESP32-WROOM-32) + MFRC522 NFC
; reader module + passive buzzer + status LED. See README.md for wiring.
;
; Build: `pio run`          (compile)
;        `pio run -t upload` (flash over USB)
;        `pio device monitor` (serial, 115200 baud)

[env:esp32dev]
platform = espressif32@^6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Library pins — spell out versions so a fresh clone builds identically.
; MFRC522 talks SPI to the RC522 module.
; ArduinoJson handles request/response serialisation without hand-rolling.
; WiFiClientSecure ships with the ESP32 core, no entry needed here.
lib_deps =
    miguelbalboa/MFRC522@^1.4.11
    bblanchon/ArduinoJson@^7.0.4

; We use `setInsecure()` against a self-signed dev cert — that path is
; compiled in by default. No extra build flags required.
build_flags =
    -D CORE_DEBUG_LEVEL=1
