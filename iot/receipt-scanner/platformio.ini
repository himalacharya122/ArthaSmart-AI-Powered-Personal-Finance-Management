; PlatformIO project for the ArthaSmart Receipt Scanner.
;
; Target: AI-Thinker ESP32-CAM (OV2640 sensor + MicroSD + onboard flash LED).
; The ESP32-CAM has no USB: flash via a USB-to-serial adapter with IO0 tied
; low during reset. See README.md for the exact dance.
;
; Build: `pio run`
; Flash: hold the IO0 button, press RESET, release IO0, then `pio run -t upload`
; Monitor: `pio device monitor` at 115200 baud

[env:esp32cam]
platform = espressif32@^6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; The esp32-camera driver ships with the ESP32 Arduino core — no lib_deps
; needed for it. ArduinoJson is used for the pairing handshake.
lib_deps =
    bblanchon/ArduinoJson@^7.0.4

; This board has NO external PSRAM. The original skeleton had BOARD_HAS_PSRAM
; here which made the framework initialise PSRAM addresses that don't exist,
; silently crashing camera init. Removed. Firmware uses CAMERA_FB_IN_DRAM.
build_flags =
    -D CORE_DEBUG_LEVEL=1

; Prevent the serial monitor from toggling RTS/DTR on connect.
; Without these lines, opening the monitor resets the chip and you miss the
; first second of output (pairing code, WiFi IP, etc.).
; With these set: open monitor, then press the physical RST button on the board.
monitor_rts = 0
monitor_dtr = 0
