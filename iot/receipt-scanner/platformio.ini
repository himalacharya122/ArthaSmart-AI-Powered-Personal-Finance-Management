; PlatformIO project for the ArthaSmart Receipt Scanner.
;
; Target: AI-Thinker ESP32-CAM (OV2640 sensor + MicroSD + onboard flash LED).
; The ESP32-CAM has no USB: flash via a USB-to-serial adapter with IO0 tied
; low during reset. See README.md for the exact dance.
;
; Build: `pio run`
; Flash: hold the IO0 button, press RESET, release IO0, then `pio run -t upload`
; Monitor: `pio device monitor` at 115200 baud

[env:esp32cam]
platform = espressif32@^6.5.0
board = esp32cam
framework = arduino
monitor_speed = 115200
upload_speed = 460800

; The esp32-camera driver ships with the ESP32 Arduino core — no lib_deps
; needed for it. ArduinoJson is used for the pairing handshake.
lib_deps =
    bblanchon/ArduinoJson@^7.0.4

; PSRAM is MANDATORY for JPEG frames bigger than QVGA. The AI-Thinker board
; has 4 MB PSRAM wired up; the flag below tells the core to use it.
build_flags =
    -D BOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -D CORE_DEBUG_LEVEL=1
